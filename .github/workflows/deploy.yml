name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # site/public/moonsorter.wasm is committed and served as-is. Rebuild it
      # here and fail on drift, so the shipped binary can never silently
      # diverge from the MoonBit sources again.
      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Check MoonBit sources
        run: |
          moon version --all
          moon check --deny-warn
          moon test

      - name: Verify the committed WASM matches the sources
        run: |
          moon build --target wasm-gc --release
          cmp _build/wasm-gc/release/build/web/web.wasm site/public/moonsorter.wasm \
            || { echo "::error::site/public/moonsorter.wasm is stale. Run 'moon build --target wasm-gc --release && cp _build/wasm-gc/release/build/web/web.wasm site/public/moonsorter.wasm' and commit the result."; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: bun install
        working-directory: ./site

      - name: Build site
        run: bun run build
        working-directory: ./site
        env:
          GITHUB_PAGES: 'true'
          PUBLIC_ANILIST_CLIENT_ID: ${{ secrets.PUBLIC_ANILIST_CLIENT_ID }}
          PUBLIC_ANILIST_RESPONSE_TYPE: 'token'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
